name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `latest`. bunfig.toml holds every dependency back a day
      # (minimumReleaseAge) as a supply-chain guard; installing whatever Bun
      # shipped that hour would run the whole gate on an unvetted toolchain, and
      # a point release that changes bun.lock's format or bun:test's defaults
      # would turn every PR red with no repository change and no way back to the
      # last green. Bump this deliberately.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # `bun run build` transpiles without type checking, so this is the only
      # thing standing between a type error and production. Keep it before the
      # build: it is fast and its failures are the most actionable.
      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test --isolate

      - name: Lint
        run: bun run lint

      # Turnstile boot-asserts on an inconsistent site-key/secret pair. CI has
      # neither, and VERCEL_ENV is unset, so it takes the non-production path.
      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      # The build regenerates the route tree. If it differs from what was
      # committed, the committed file was stale - the defect that made PR #60 fail
      # typecheck on two routes that existed but were not registered.
      - name: Route tree is current
        run: git diff --exit-code -- src/routeTree.gen.ts

  # Separate job so the fast gate stays fast, and a browser sweep can never block
  # a typecheck fix. Non-blocking until it has been green on main twice; then it
  # becomes required (P0-12, tech lead).
  brand-verify:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Point the app at the fixture rather than a name that does not resolve.
      # With an unreachable host the verifier reports DNS failures on every page,
      # which says nothing about the brand.
      - name: Build against the fixture
        run: bun run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54329
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: http://127.0.0.1:54329
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key

      - name: Install brand verifier browser
        run: bunx playwright install --with-deps chromium

      - name: Verify public brand
        shell: bash
        run: |
          node scripts/ci/supabase-fixture.mjs > /tmp/hkscda-fixture.log 2>&1 &
          fixture_pid=$!
          HOST=127.0.0.1 PORT=4173 NITRO_HOST=127.0.0.1 NITRO_PORT=4173             bun run preview > /tmp/hkscda-brand-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" "$fixture_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat /tmp/hkscda-brand-preview.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            cat /tmp/hkscda-brand-preview.log
            exit 1
          fi

          curl --fail --silent "http://127.0.0.1:54329/rest/v1/animals?select=id&limit=1" >/dev/null || {
            echo "fixture did not answer"
            cat /tmp/hkscda-fixture.log
            exit 1
          }

          bun run verify:brand
        env:
          BASE_URL: http://127.0.0.1:4173
          OUTPUT_DIR: artifacts/brand-ci
          BRAND_VERIFY_TIMEOUT: 15000
          MODE: brand
          # bun run preview spawns the actual SSR server process here, which
          # now needs live Supabase config at request time: /help's route
          # loader (added for the FAQ CMS) is the first public route whose
          # SSR path reads through createSupabaseServiceClient(). Without
          # these, getSupabaseServerConfig() throws "Missing required
          # environment variable" and /help 500s under this job specifically
          # (the earlier "Build against the fixture" step's env: does not
          # carry over to this separate step).
          VITE_SUPABASE_URL: http://127.0.0.1:54329
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_URL: http://127.0.0.1:54329
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key

      - name: Upload brand artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brand-ci
          path: artifacts/brand-ci
          if-no-files-found: ignore

  # Separate job so the fast gate stays fast. Non-blocking until proven green
  # repeatedly on main, then promote via branch protection (matching the
  # process already used for brand-verify).
  rls-matrix:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Start local Supabase stack
        run: bunx supabase start

      - name: Run RLS behavioral tests
        run: bun run test:rls

      - name: Stop local Supabase stack
        if: always()
        run: bunx supabase stop
