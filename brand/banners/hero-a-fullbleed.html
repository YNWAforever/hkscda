<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Noto+Sans+HK:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --rose:#E05C78; --rose-dark:#CF4A66; --navy:#1D2353; --navy-2:#283066;
    --salmon:#F27D92; --salmon-light:#F298A4; --blush:#FCE8EB; --cream:#FDF7F4;
    --lavender:#E9E9F6; --ink:#2B2D42;
    --display:"Baloo 2","Noto Sans HK",sans-serif; --body:"Noto Sans HK",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1920px;height:800px;overflow:hidden}
  .banner{position:relative;width:1920px;height:800px;background:var(--navy);font-family:var(--body)}

  /* full-bleed photo, anchored right where the subjects sit */
  .photo{position:absolute;inset:0;background:url("../../src/assets/hero.jpg") center 28%/cover no-repeat}
  /* legibility wash: deep navy from the left into warm transparency */
  .wash{position:absolute;inset:0;background:
    linear-gradient(90deg,rgba(29,35,83,.96) 0%,rgba(29,35,83,.90) 26%,rgba(29,35,83,.55) 46%,rgba(29,35,83,.08) 66%,rgba(29,35,83,0) 80%)}
  .wash-bottom{position:absolute;inset:0;background:linear-gradient(0deg,rgba(29,35,83,.45) 0%,rgba(29,35,83,0) 28%)}

  .content{position:absolute;left:120px;top:50%;transform:translateY(-50%);width:760px;color:#fff}
  .badge{display:inline-flex;align-items:center;gap:10px;background:rgba(252,232,235,.14);border:1px solid rgba(242,152,164,.45);
    border-radius:999px;padding:10px 22px;font-size:20px;font-weight:700;color:var(--blush);letter-spacing:.02em;margin-bottom:30px}
  .badge .dot{width:10px;height:10px;border-radius:50%;background:var(--salmon)}
  h1{font-family:var(--display);font-weight:800;font-size:84px;line-height:1.18;letter-spacing:.01em;margin-bottom:26px}
  h1 .accent{position:relative;color:var(--salmon);display:inline-block}
  h1 .accent svg{position:absolute;left:0;bottom:-10px;width:100%;height:14px;color:var(--rose)}
  .sub{font-size:26px;line-height:1.65;color:var(--lavender);max-width:40ch;margin-bottom:38px;font-weight:500}
  .org{display:flex;align-items:center;gap:18px}
  .paw{width:58px;height:58px;border-radius:50%;background:var(--rose);display:flex;align-items:center;justify-content:center;flex:none}
  .paw svg{width:30px;height:30px;fill:#fff}
  .org .name{font-family:var(--display);font-weight:700;font-size:30px;color:#fff;line-height:1.2}
  .org .en{font-size:17px;color:var(--salmon-light);letter-spacing:.14em;font-weight:500}

  /* floating stat chip, echoes the site's rating badge */
  .chip{position:absolute;right:110px;bottom:84px;background:rgba(253,247,244,.95);border-radius:24px;
    padding:22px 32px;display:flex;align-items:center;gap:18px;box-shadow:0 24px 60px rgba(29,35,83,.35)}
  .chip .num{font-family:var(--display);font-weight:800;font-size:44px;color:var(--rose)}
  .chip .lbl{font-size:18px;color:var(--ink);font-weight:700;line-height:1.4}
  .chip .lbl small{display:block;font-size:14px;color:#6b6e85;font-weight:500}
</style>
</head>
<body>
<div class="banner">
  <div class="photo"></div>
  <div class="wash"></div>
  <div class="wash-bottom"></div>

  <div class="content">
    <div class="badge"><span class="dot"></span>本會為「不殺」(No Kill) 政府認可慈善機構</div>
    <h1>領養代替購買<br>
      <span class="accent">拯救一個生命
        <svg viewBox="0 0 200 12" preserveAspectRatio="none" aria-hidden="true">
          <path d="M2 9 Q 50 2 100 7 T 198 5" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/>
        </svg>
      </span>
    </h1>
    <p class="sub">香港拯救貓狗協會自2007年成立，致力為流浪貓狗提供糧食、醫療、絕育及領養服務。</p>
    <div class="org">
      <div class="paw">
        <svg viewBox="0 0 24 24"><path d="M8.35 3c1.18-.17 2.43 1.12 2.79 2.9.36 1.77-.29 3.35-1.47 3.53-1.17.18-2.43-1.11-2.8-2.89-.37-1.77.3-3.35 1.48-3.54zm7.3 0c1.19.19 1.85 1.77 1.5 3.54-.38 1.78-1.63 3.07-2.81 2.89-1.18-.18-1.84-1.76-1.47-3.53.36-1.78 1.61-3.07 2.78-2.9zm-12 5.8c1.08-.5 2.6.34 3.4 1.88.8 1.55.57 3.21-.5 3.71-1.07.51-2.59-.33-3.39-1.87-.8-1.55-.58-3.21.49-3.72zm16.7 0c1.07.51 1.29 2.17.49 3.72-.8 1.54-2.32 2.38-3.39 1.87-1.07-.5-1.3-2.16-.5-3.71.8-1.54 2.32-2.38 3.4-1.88zM12 11c2.5 0 6 3.5 6 6.5 0 1.93-1.57 3.5-3.5 3.5-.95 0-1.74-.5-2.5-.5s-1.55.5-2.5.5C7.57 21 6 19.43 6 17.5 6 14.5 9.5 11 12 11z"/></svg>
      </div>
      <div>
        <div class="name">香港拯救貓狗協會</div>
        <div class="en">HONG KONG SAVING CAT &amp; DOG ASSOCIATION</div>
      </div>
    </div>
  </div>

  <div class="chip">
    <div class="num">600+</div>
    <div class="lbl">每年救助毛孩<small>糧食 · 醫療 · 絕育 · 領養</small></div>
  </div>
</div>
</body>
</html>
