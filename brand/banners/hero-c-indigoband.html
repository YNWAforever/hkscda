<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Noto+Sans+HK:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --rose: #e05c78;
        --rose-dark: #cf4a66;
        --navy: #1d2353;
        --navy-2: #283066;
        --salmon: #f27d92;
        --salmon-light: #f298a4;
        --blush: #fce8eb;
        --cream: #fdf7f4;
        --lavender: #e9e9f6;
        --ink: #2b2d42;
        --display: "Baloo 2", "Noto Sans HK", sans-serif;
        --body: "Noto Sans HK", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1920px;
        height: 800px;
        overflow: hidden;
      }
      .banner {
        position: relative;
        width: 1920px;
        height: 800px;
        font-family: var(--body);
        overflow: hidden;
        background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 60%, #32396f 100%);
      }

      /* soft glow accents */
      .glow-r {
        position: absolute;
        top: -200px;
        right: -140px;
        width: 640px;
        height: 640px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(224, 92, 120, 0.28) 0%, transparent 70%);
      }
      .glow-l {
        position: absolute;
        bottom: -260px;
        left: -180px;
        width: 700px;
        height: 700px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(242, 125, 146, 0.18) 0%, transparent 70%);
      }
      .pink-strip {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 14px;
        background: var(--salmon-light);
      }

      /* photo trio — stacked rounded cards on the right */
      .trio {
        position: absolute;
        right: 130px;
        top: 50%;
        transform: translateY(-50%);
        width: 680px;
        height: 600px;
      }
      .card {
        position: absolute;
        border-radius: 32px;
        overflow: hidden;
        border: 5px solid rgba(253, 247, 244, 0.9);
        box-shadow: 0 28px 64px rgba(0, 0, 0, 0.4);
      }
      .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .card.main {
        left: 130px;
        top: 30px;
        width: 430px;
        height: 540px;
        transform: rotate(2.5deg);
        z-index: 3;
      }
      .card.main img {
        object-position: center 25%;
      }
      .card.cat {
        left: -10px;
        top: 96px;
        width: 230px;
        height: 260px;
        transform: rotate(-6deg);
        z-index: 2;
      }
      .card.dog {
        left: 444px;
        top: 280px;
        width: 240px;
        height: 270px;
        transform: rotate(5deg);
        z-index: 4;
      }
      .heart {
        position: absolute;
        z-index: 5;
        color: var(--salmon);
        opacity: 0.95;
      }
      .heart svg {
        width: 100%;
        height: 100%;
        fill: currentColor;
      }
      .heart.h1 {
        left: 84px;
        top: -6px;
        width: 44px;
        height: 44px;
        transform: rotate(-12deg);
      }
      .heart.h2 {
        left: 620px;
        top: 120px;
        width: 34px;
        height: 34px;
        transform: rotate(14deg);
        color: var(--rose);
      }
      .heart.h3 {
        left: 30px;
        top: 430px;
        width: 28px;
        height: 28px;
        transform: rotate(-8deg);
        color: var(--blush);
      }

      .content {
        position: absolute;
        left: 130px;
        top: 50%;
        transform: translateY(-50%);
        width: 880px;
        color: #fff;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: rgba(224, 92, 120, 0.18);
        border: 1px solid rgba(242, 125, 146, 0.5);
        border-radius: 999px;
        padding: 10px 22px;
        font-size: 20px;
        font-weight: 700;
        color: var(--blush);
        margin-bottom: 32px;
      }
      .badge .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--salmon);
      }
      h1 {
        font-family: var(--display);
        font-weight: 800;
        font-size: 88px;
        line-height: 1.16;
        margin-bottom: 26px;
      }
      h1 .accent {
        position: relative;
        color: var(--salmon);
        display: inline-block;
      }
      h1 .accent svg {
        position: absolute;
        left: 0;
        bottom: -10px;
        width: 100%;
        height: 14px;
        color: var(--rose);
      }
      .sub {
        font-size: 26px;
        line-height: 1.65;
        color: var(--lavender);
        max-width: 38ch;
        margin-bottom: 42px;
        font-weight: 500;
      }

      .stats {
        display: flex;
        gap: 56px;
        margin-bottom: 46px;
      }
      .stat .num {
        font-family: var(--display);
        font-weight: 800;
        font-size: 52px;
        color: var(--salmon);
        line-height: 1.1;
      }
      .stat .lbl {
        font-size: 18px;
        color: var(--lavender);
        font-weight: 500;
        margin-top: 4px;
      }
      .stat {
        position: relative;
        padding-left: 0;
      }
      .stat + .stat {
        padding-left: 56px;
        border-left: 1px solid rgba(233, 233, 246, 0.25);
      }

      .org {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .paw {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: var(--rose);
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      .paw svg {
        width: 28px;
        height: 28px;
        fill: #fff;
      }
      .org .name {
        font-family: var(--display);
        font-weight: 700;
        font-size: 28px;
        line-height: 1.2;
      }
      .org .en {
        font-size: 16px;
        color: var(--salmon-light);
        letter-spacing: 0.14em;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="glow-r"></div>
      <div class="glow-l"></div>

      <div class="content">
        <div class="badge"><span class="dot"></span>本會為「不殺」(No Kill) 政府認可慈善機構</div>
        <h1>
          領養代替購買<br />
          <span class="accent"
            >拯救一個生命
            <svg viewBox="0 0 200 12" preserveAspectRatio="none" aria-hidden="true">
              <path
                d="M2 9 Q 50 2 100 7 T 198 5"
                stroke="currentColor"
                stroke-width="4"
                fill="none"
                stroke-linecap="round"
              />
            </svg>
          </span>
        </h1>
        <p class="sub">香港拯救貓狗協會致力為流浪貓狗提供糧食、醫療、絕育及領養服務。</p>
        <div class="stats">
          <div class="stat">
            <div class="num">2007</div>
            <div class="lbl">成立年份</div>
          </div>
          <div class="stat">
            <div class="num">600+</div>
            <div class="lbl">每年救助毛孩</div>
          </div>
          <div class="stat">
            <div class="num">3.5K+</div>
            <div class="lbl">義工及支持者</div>
          </div>
        </div>
        <div class="org">
          <div class="paw">
            <svg viewBox="0 0 24 24">
              <path
                d="M8.35 3c1.18-.17 2.43 1.12 2.79 2.9.36 1.77-.29 3.35-1.47 3.53-1.17.18-2.43-1.11-2.8-2.89-.37-1.77.3-3.35 1.48-3.54zm7.3 0c1.19.19 1.85 1.77 1.5 3.54-.38 1.78-1.63 3.07-2.81 2.89-1.18-.18-1.84-1.76-1.47-3.53.36-1.78 1.61-3.07 2.78-2.9zm-12 5.8c1.08-.5 2.6.34 3.4 1.88.8 1.55.57 3.21-.5 3.71-1.07.51-2.59-.33-3.39-1.87-.8-1.55-.58-3.21.49-3.72zm16.7 0c1.07.51 1.29 2.17.49 3.72-.8 1.54-2.32 2.38-3.39 1.87-1.07-.5-1.3-2.16-.5-3.71.8-1.54 2.32-2.38 3.4-1.88zM12 11c2.5 0 6 3.5 6 6.5 0 1.93-1.57 3.5-3.5 3.5-.95 0-1.74-.5-2.5-.5s-1.55.5-2.5.5C7.57 21 6 19.43 6 17.5 6 14.5 9.5 11 12 11z"
              />
            </svg>
          </div>
          <div>
            <div class="name">香港拯救貓狗協會</div>
            <div class="en">HONG KONG SAVING CAT &amp; DOG ASSOCIATION</div>
          </div>
        </div>
      </div>

      <div class="trio">
        <div class="heart h1">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 21s-6.7-4.3-9.3-8.5C.8 9.2 2.4 5.5 5.9 5.1c2-.2 3.9.9 4.8 2.6.2.4.4.4.6 0 .9-1.7 2.8-2.8 4.8-2.6 3.5.4 5.1 4.1 3.2 7.4C16.7 16.7 12 21 12 21z"
            />
          </svg>
        </div>
        <div class="heart h2">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 21s-6.7-4.3-9.3-8.5C.8 9.2 2.4 5.5 5.9 5.1c2-.2 3.9.9 4.8 2.6.2.4.4.4.6 0 .9-1.7 2.8-2.8 4.8-2.6 3.5.4 5.1 4.1 3.2 7.4C16.7 16.7 12 21 12 21z"
            />
          </svg>
        </div>
        <div class="heart h3">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 21s-6.7-4.3-9.3-8.5C.8 9.2 2.4 5.5 5.9 5.1c2-.2 3.9.9 4.8 2.6.2.4.4.4.6 0 .9-1.7 2.8-2.8 4.8-2.6 3.5.4 5.1 4.1 3.2 7.4C16.7 16.7 12 21 12 21z"
            />
          </svg>
        </div>
        <div class="card cat"><img src="../../src/assets/cat1.jpg" alt="待領養貓咪" /></div>
        <div class="card main">
          <img src="../../src/assets/hero.jpg" alt="義工懷抱獲救小動物" />
        </div>
        <div class="card dog"><img src="../../src/assets/dog1.jpg" alt="待領養狗狗" /></div>
      </div>

      <div class="pink-strip"></div>
    </div>
  </body>
</html>
